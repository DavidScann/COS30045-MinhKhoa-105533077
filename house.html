<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { margin:0; background:#eaeaea; }
</style>
</head>
<body>

<svg id="scene" width="800" height="500"></svg>

<script>
const svg = d3.select("#scene");

// SKY
svg.append("rect")
  .attr("width", 800)
  .attr("height", 500)
  .attr("fill", "#87CEEB");

// SUN
svg.append("circle")
  .attr("cx", 700)
  .attr("cy", 80)
  .attr("r", 40)
  .attr("fill", "#FFD54A");

// MOUNTAINS
const mountains = [
  "0,300 200,120 400,300",
  "250,300 450,140 650,300",
  "500,300 680,170 800,300"
];

svg.selectAll(".mountain")
  .data(mountains)
  .enter()
  .append("polygon")
  .attr("points", d => d)
  .attr("fill", "#6C7A89");

// GRASS
svg.append("rect")
  .attr("y", 300)
  .attr("width", 800)
  .attr("height", 200)
  .attr("fill", "#4CAF50");

// HOUSE BASE
svg.append("rect")
  .attr("x", 320)
  .attr("y", 250)
  .attr("width", 160)
  .attr("height", 120)
  .attr("fill", "#F4A261")
  .attr("stroke", "black");

// ROOF
svg.append("polygon")
  .attr("points", "300,250 400,180 500,250")
  .attr("fill", "#D62828");

// DOOR
svg.append("rect")
  .attr("x", 385)
  .attr("y", 300)
  .attr("width", 30)
  .attr("height", 70)
  .attr("fill", "#6D4C41");

// WINDOWS
const windows = [
  {x:340,y:270},
  {x:430,y:270}
];

svg.selectAll(".window")
  .data(windows)
  .enter()
  .append("rect")
  .attr("x", d => d.x)
  .attr("y", d => d.y)
  .attr("width", 30)
  .attr("height", 30)
  .attr("fill", "#BDE0FE")
  .attr("stroke", "black");

// TREE
const tree = svg.append("g");

tree.append("rect")
  .attr("x", 150)
  .attr("y", 280)
  .attr("width", 20)
  .attr("height", 70)
  .attr("fill", "#6D4C41");

tree.append("circle")
  .attr("cx", 160)
  .attr("cy", 260)
  .attr("r", 40)
  .attr("fill", "#2E7D32");

tree.append("circle")
  .attr("cx", 130)
  .attr("cy", 270)
  .attr("r", 30)
  .attr("fill", "#2E7D32");

tree.append("circle")
  .attr("cx", 190)
  .attr("cy", 270)
  .attr("r", 30)
  .attr("fill", "#2E7D32");

</script>

</body>
</html>
